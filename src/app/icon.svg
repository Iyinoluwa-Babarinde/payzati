<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="payzati-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1dbb9c" />
      <stop offset="100%" stop-color="#00d4aa" />
    </linearGradient>
    <radialGradient id="payzati-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 212, 170, 0.25)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="rgba(0, 212, 170, 0.3)" stroke-width="12" />

  <!-- Background Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#payzati-glow)" />

  <!-- Payzati Brand Grid Mark -->
  <g transform="translate(116, 116)">
    <!-- Top Row: 2 Squares -->
    <rect x="20" y="20" width="100" height="100" rx="20" fill="url(#payzati-grad)" />
    <rect x="160" y="20" width="100" height="100" rx="20" fill="url(#payzati-grad)" />

    <!-- Bottom Row: 2 Circles -->
    <circle cx="70" cy="210" r="50" fill="url(#payzati-grad)" />
    <circle cx="210" cy="210" r="50" fill="url(#payzati-grad)" />
  </g>
</svg>
