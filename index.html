<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payzati — Global Payroll, Instant Settlement</title>
  <meta http-equiv="refresh" content="0; url=https://payzatidemo.vercel.app" />
  <link rel="canonical" href="https://payzatidemo.vercel.app" />
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #FAF9F6;
      color: #111817;
      font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", sans-serif;
    }
    .shell {
      padding: 6px;
      border-radius: 26px;
      background: rgba(17, 24, 23, 0.04);
      border: 1px solid rgba(17, 24, 23, 0.08);
      max-width: 420px;
      width: calc(100% - 32px);
    }
    .core {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 18px 40px -18px rgba(11, 110, 92, 0.14);
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; letter-spacing: -0.02em; }
    p { font-size: 0.9rem; color: #576361; margin: 0 0 24px; line-height: 1.5; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0B6E5C;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 12px 22px;
      border-radius: 9999px;
    }
  </style>
  <script>
    window.location.replace("https://payzatidemo.vercel.app");
  </script>
</head>
<body>
  <div class="shell">
    <div class="core">
      <h1>Opening Payzati</h1>
      <p>Redirecting you to the live Payzati Global Payroll workspace powered by Interledger Open Payments.</p>
      <a href="https://payzatidemo.vercel.app">Continue to Payzati →</a>
    </div>
  </div>
</body>
</html>
